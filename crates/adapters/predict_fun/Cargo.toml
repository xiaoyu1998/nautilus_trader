[package]
name = "nautilus-predict-fun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Predict.fun integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_predict_fun"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
high-precision = ["nautilus-model/high-precision"]

[package.metadata.docs.rs]
features = ["high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "predict-fun-event-discovery"
path = "bin/event_discovery.rs"
doc = false
test = false

[[bin]]
name = "predict-fun-search-markets"
path = "bin/search_markets.rs"
doc = false
test = false

[[bin]]
name = "predict-fun-orderbook"
path = "bin/orderbook.rs"
doc = false
test = false

[[bin]]
name = "predict-fun-auth-message"
path = "bin/auth_message.rs"
doc = false
test = false

[[bin]]
name = "predict-fun-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

[[bin]]
name = "predict-fun-ws-exec"
path = "bin/ws_exec.rs"
doc = false
test = false
