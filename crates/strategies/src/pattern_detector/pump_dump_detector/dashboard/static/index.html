<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pump Dump Detector Pool</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #0d1117; color: #e6edf3; }
    h1 { margin: 0 0 12px 0; font-size: 1.25rem; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    input { padding: 8px 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; min-width: 200px; }
    button { padding: 8px 14px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; }
    button.primary { background: #238636; border-color: #238636; }
    button.danger { background: #da3633; border-color: #da3633; }
    .charts { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    .chart-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; flex: 0 1 calc(33.333% - 11px); min-width: 280px; max-width: calc(33.333% - 11px); }
    .chart-card h2 { margin: 0 0 8px 0; font-size: 0.95rem; font-weight: 600; color: #8b949e; }
    .chart-container { width: 100%; height: 360px; }
    .meta { margin-bottom: 8px; font-size: 12px; color: #8b949e; white-space: pre-wrap; }
    #status { color: #8b949e; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Pump Dump Detector Pool</h1>
  <div class="row">
    <input type="text" id="market" placeholder="e.g. btc or BTCUSDT-PERP.BINANCE" />
    <button class="primary" id="btnAdd">Add</button>
    <button class="danger" id="btnRemove">Remove</button>
    <span id="status"></span>
  </div>
  <div id="charts" class="charts"></div>
  <script src="app.js"></script>
</body>
</html>
